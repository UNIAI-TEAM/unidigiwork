name: Deploy to Server

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry-harbor.ubos.vn
      HARBOR_NAMESPACE: github-demo
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Require IMAGE_NAME
        run: |
          if [ -z "${{ vars.IMAGE_NAME }}" ]; then
            echo "set IMAGE_NAME to repo name only e.g. pinsony"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile is missing on this branch."
            echo "Push the Lovable app source (package.json, src/, Dockerfile) before deploy."
            echo "Run onboard again to sync the default Dockerfile if the repo only has deploy templates."
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "package.json is missing — this repo does not look like a Lovable/Vite app yet."
            exit 1
          fi

      # Biến VITE_* được nướng vào bundle trình duyệt lúc BUILD (vite `define`),
      # không đọc được lúc chạy — đặt chúng trong .env trên server là vô ích.
      # Trước đây runner có sẵn .env vì file này nằm trong git; từ khi thôi theo
      # dõi .env, `loadEnv()` không còn gì để đọc nên bundle ra `undefined` và
      # app chết ngay khi trình duyệt tải trang. Dựng lại file đó từ secrets.
      #
      # Chỉ ghi biến VITE_* — chúng vốn công khai vì nằm trong bundle client.
      # Bí mật runtime (SUPABASE_SERVICE_ROLE_KEY, LOVABLE_API_KEY, LIVEKIT_*)
      # KHÔNG được ghi ở đây: chúng đi qua env_file của docker compose trên server.
      - name: Write build-time env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          missing=""
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Thiếu secret bắt buộc cho build:$missing"
            echo "Thêm tại Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID"
          } > .env
          echo "Đã ghi .env với $(grep -c . .env) biến build-time."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.HARBOR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.HARBOR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_FULL_NAME: ${{ env.REGISTRY }}/${{ env.HARBOR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,IMAGE_FULL_NAME,REGISTRY_USERNAME,REGISTRY_PASSWORD,DEPLOY_ROOT,REPO_NAME
          script: |
            set -e
            cd "$DEPLOY_ROOT/$REPO_NAME"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
