name: Quality Gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:changed
      - run: bun run lint || true
      - run: bun run test:contracts
      - run: bun run test:architecture
      - run: bun run test:tenant
      - run: bun run test:rls
      - run: bun run test
      - run: bun run build