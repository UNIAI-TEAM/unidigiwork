name: Quality Gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain-sdk-gate:
    name: Domain SDK Enforcement Gate (required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Enforce Domain SDK boundaries (Blueprint §25 + ADR-1D-001)
        run: bun run test:domain-sdk
      - name: Upload violation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: domain-sdk-violations
          path: .lovable/reports/domain-sdk-violations.*
          if-no-files-found: ignore
      - name: Comment violations on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.lovable/reports/domain-sdk-violations.md';
            if (!fs.existsSync(path)) {
              core.info('No violation report found; skipping PR comment.');
              return;
            }
            let body = fs.readFileSync(path, 'utf8');
            const MARKER = '<!-- domain-sdk-gate-report -->';
            const MAX = 60000;
            if (body.length > MAX) {
              body = body.slice(0, MAX) + `\n\n_Report truncated. Download the full \`domain-sdk-violations\` artifact from the Actions run for the complete list._`;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.payload.pull_request?.head?.sha ?? context.sha;
            body = `${MARKER}\n### ❌ Domain SDK Enforcement Gate failed\n\nCommit: \`${commit.slice(0,7)}\` · [View CI run](${runUrl}) · Artifact: \`domain-sdk-violations\`\n\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: existing } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const prior = existing.find(c => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  verify:
    runs-on: ubuntu-latest
    needs: [domain-sdk-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:changed
      - run: bun run lint || true
      - run: bun run test:contracts
      - run: bun run test:architecture
      - run: bun run test:tenant
      - run: bun run test:rls
      - run: bun run test:domain-sdk
      - run: bun run test
      - run: bun run build